name: Publish Akari daily story

# Website only. This workflow does not post to X or read repository credentials.
# 07:00 America/Los_Angeles is 15:00 UTC during Pacific Standard Time and
# 14:00 UTC during Pacific Daylight Time. GitHub may start a cron late.
# The publisher releases at most one eligible entry and does nothing when
# akari/inbox has no manifest. Do not commit unreleased stories here:
# this repository is public.

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: akari-daily-story
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the next ready story
        run: python3 scripts/akari_publish.py --inbox akari/inbox --apply
      - name: Commit published pages
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No site changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- akari/stories index.html
          git commit -m "Publish the next Akari daily story"
          git push
